<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wave Energy Converter – Mechanical Animation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    overflow: hidden;
    background: #020a18;
    color: #f3f4f6;
    font-family: Inter, system-ui, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #canvas-container { position: fixed; inset: 0; z-index: 0; }
  #canvas-container canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    gap: 12px;
    pointer-events: none;
  }
  #ui > * { pointer-events: none; }
  .glass, .glass * { pointer-events: auto; }
  .glass {
    background: rgba(9, 18, 35, .78);
    border: 1px solid rgba(255,255,255,.13);
    box-shadow: 0 14px 36px rgba(0,0,0,.34);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 15px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 15px;
    border-left: 4px solid #38bdf8;
    min-width: 0;
  }
  .logo {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    display: grid;
    place-items: center;
    color: #38bdf8;
    background: rgba(14,165,233,.17);
    border-radius: 10px;
    font-size: 18px;
  }
  .brand h1 { margin: 0; font-size: 15px; line-height: 1.35; font-weight: 700; }
  .brand p { margin: 4px 0 0; color: #9aabc1; font-size: 10.5px; }
  .camrow {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    padding: 6px;
    max-width: 600px;
  }
  .gbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 38px;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    background: rgba(30,41,59,.76);
    color: #e2e8f0;
    font: 600 11px Inter, sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .gbtn:hover { background: rgba(51,65,85,.94); border-color: rgba(56,189,248,.5); }
  .gbtn:active { transform: scale(.98); }
  .gbtn.active { color: #7dd3fc; border-color: #38bdf8; background: rgba(14,165,233,.2); }
  footer { display: flex; justify-content: center; align-items: flex-end; gap: 8px; }
  .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 7px; }
  .toolbar .gbtn { min-width: 94px; }
  #speed { min-width: 112px; outline: none; }
  #speed option { background: #0f172a; color: #f3f4f6; }
  .hint {
    align-self: flex-end;
    color: rgba(226,232,240,.72);
    background: rgba(2,6,23,.48);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 9px;
    padding: 8px 11px;
    font-size: 10px;
    letter-spacing: .01em;
    pointer-events: none;
  }

  @media (max-width: 900px) {
    #ui { padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
    header { flex-direction: column; align-items: stretch; gap: 8px; }
    .brand { width: 100%; padding: 9px 11px; }
    .brand h1 { font-size: 14px; }
    .brand p { font-size: 9.5px; }
    .logo { width: 34px; height: 34px; flex-basis: 34px; font-size: 16px; }
    .camrow {
      width: 100%;
      max-width: none;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 6px;
    }
    .camrow .gbtn { min-width: 0; min-height: 36px; padding: 7px 4px; font-size: 10px; gap: 5px; }
    footer { justify-content: center; }
    .toolbar { justify-content: center; width: 100%; }
    .toolbar .gbtn { flex: 1 1 0; min-width: 0; }
    #speed { flex: 1.2 1 0; min-width: 0; }
    .hint { display: none; }
  }
  @media (max-width: 480px) {
    .brand h1 { font-size: 13px; }
    .camrow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .camrow .gbtn { font-size: 9.5px; }
    .toolbar { gap: 5px; padding: 6px; }
    .toolbar .gbtn { min-height: 40px; padding: 7px 5px; font-size: 10px; }
    #speed { font-size: 10px; }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    #ui { padding: 7px 9px; }
    header { flex-direction: row; align-items: flex-start; }
    .brand { padding: 7px 9px; }
    .brand p { display: none; }
    .logo { width: 30px; height: 30px; flex-basis: 30px; }
    .camrow { display: flex; width: auto; max-width: 65%; }
    .camrow .gbtn { min-height: 32px; padding: 5px 7px; }
    .toolbar { padding: 5px; }
    .toolbar .gbtn { min-height: 33px; }
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="ui">
  <header>
    <div class="glass brand">
      <div class="logo"><i class="fa-solid fa-bolt-lightning"></i></div>
      <div>
        <h1>Wave Energy Converter</h1>
        <p>Mechanical animation · heaving buoy · rack &amp; pinion drive</p>
      </div>
    </div>

    <nav class="glass camrow" id="camrow" aria-label="Camera views">
      <button class="gbtn active" data-cam="orbit"><i class="fa-solid fa-globe"></i> Orbit</button>
      <button class="gbtn" data-cam="pto"><i class="fa-solid fa-gear"></i> Dynamo station</button>
      <button class="gbtn" data-cam="buoy"><i class="fa-solid fa-water"></i> Buoy level</button>
      <button class="gbtn" data-cam="seabed"><i class="fa-solid fa-anchor"></i> Seabed</button>
      <button class="gbtn" data-cam="top"><i class="fa-solid fa-arrows-up-to-line"></i> Top-down</button>
    </nav>
  </header>

  <footer>
    <div class="glass toolbar">
      <button class="gbtn" id="btn-pause"><i class="fa-solid fa-pause"></i> Pause</button>
      <button class="gbtn" id="btn-reset"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      <select class="gbtn" id="speed" aria-label="Animation speed">
        <option value="0.55">Slow</option>
        <option value="1" selected>Normal</option>
        <option value="1.8">Fast</option>
      </select>
    </div>
    <div class="hint">Drag to orbit · scroll or pinch to zoom</div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  'use strict';

  /*
    This is a visual, procedural animation only.
    It does not calculate forces, power, energy, voltage, current, or performance.
  */

  const $ = id => document.getElementById(id);
  const BED = -32;
  const STATION_Y = 11;
  const SHAFT_TOP = 16;
  const HP = 26;
  const BUOY_HEIGHT = 4;
  const BUOY_RADIUS = 10;
  const HOLE_RADIUS = 1.5;
  const PINION_RADIUS = 1.2;
  const GEAR_RATIO_VISUAL = 24;
  const BASE_DRAFT = 0.95;

  let scene, camera, renderer, orbit;
  let oceanGeo, oceanMesh, moving, station;
  let pinion, rotor;
  let running = true;
  let animationSpeed = 1;
  let elapsed = 0;
  let generatorAngle = 0;
  let previousFrame = performance.now();
  let lastHeave = 0;
  let wireframe = false;
  const materials = {};

  const CAMERAS = {
    orbit:   { position: [-45, 24, 62], target: [0, 4, 0] },
    pto:     { position: [9, 14, 16], target: [0.5, 11, 0.5] },
    buoy:    { position: [-30, 5, 32], target: [0, 0, 0] },
    seabed:  { position: [-34, -22, 38], target: [0, -20, 0] },
    top:     { position: [0, 75, 0.1], target: [0, 8, 0] }
  };

  function material(color, options = {}) {
    return new THREE.MeshStandardMaterial({ color, ...options });
  }

  function makeMesh(geometry, mat, position, parent, castShadow = true) {
    const mesh = new THREE.Mesh(geometry, mat);
    mesh.position.set(position[0], position[1], position[2]);
    mesh.castShadow = castShadow;
    if (parent) parent.add(mesh);
    return mesh;
  }

  function initMaterials() {
    Object.assign(materials, {
      rubber: material(0x0f172a, { roughness: 0.62, side: THREE.DoubleSide }),
      yellow: material(0xfacc15, { roughness: 0.4, metalness: 0.2 }),
      chrome: material(0xe2e8f0, { metalness: 0.9, roughness: 0.16 }),
      white: material(0xf8fafc, { roughness: 0.3, metalness: 0.1 }),
      orange: material(0xf97316, { roughness: 0.35, metalness: 0.15 }),
      steel: material(0x64748b, { metalness: 0.8, roughness: 0.22 }),
      dark: material(0x1e293b, { roughness: 0.5 }),
      sleeve: material(0x1e293b, { transparent: true, opacity: 0.5, roughness: 0.5 }),
      concrete: material(0x334155, { roughness: 0.85 }),
      shell: material(0x4a7fa8, { transparent: true, opacity: 0.42, roughness: 0.3 }),
      tube: material(0xf8fafc, { transparent: true, opacity: 0.24, roughness: 0.3, side: THREE.DoubleSide }),
      seabed: material(0xc2b280, { roughness: 0.95 }),
      rock: material(0x4a5568, { roughness: 0.85 })
    });
  }

  function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020a18);
    scene.fog = new THREE.FogExp2(0x020a18, 0.011);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(...CAMERAS.orbit.position);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    $('canvas-container').appendChild(renderer.domElement);

    orbit = new THREE.OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.06;
    orbit.target.set(...CAMERAS.orbit.target);
    orbit.maxPolarAngle = Math.PI / 2 + 0.1;
    orbit.minDistance = 5;
    orbit.maxDistance = 170;

    const sun = new THREE.DirectionalLight(0xfff5ea, 2.25);
    sun.position.set(45, 70, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1536, 1536);
    Object.assign(sun.shadow.camera, { near: 0.5, far: 160, left: -45, right: 45, top: 45, bottom: -45 });
    scene.add(sun, new THREE.AmbientLight(0x1e3a8a, 1.35));

    const fill = new THREE.DirectionalLight(0x06b6d4, 0.8);
    fill.position.set(-15, -30, -15);
    scene.add(fill);

    initMaterials();
    buildSeabed();
    buildOcean();
    buildFixedStructure();
    moving = new THREE.Group();
    scene.add(moving);
    buildMovingStructure();
    buildDynamoStation();

    window.addEventListener('resize', onResize);
  }

  function buildSeabed() {
    const geometry = new THREE.PlaneGeometry(200, 200, 50, 50);
    const positions = geometry.attributes.position;
    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i);
      const z = positions.getY(i);
      positions.setZ(i, Math.sin(x * 0.15) * Math.cos(z * 0.15) * 1.5 + Math.sin(x * 0.04) * 2.5);
    }
    geometry.computeVertexNormals();
    const bed = new THREE.Mesh(geometry, materials.seabed);
    bed.rotation.x = -Math.PI / 2;
    bed.position.y = BED;
    bed.receiveShadow = true;
    scene.add(bed);

    const rockGeometry = new THREE.DodecahedronGeometry(1, 1);
    for (let i = 0; i < 34; i++) {
      const x = (Math.random() - 0.5) * 140;
      const z = (Math.random() - 0.5) * 140;
      if (Math.hypot(x, z) < 14) continue;
      const size = 1 + Math.random() * 4;
      const rock = makeMesh(rockGeometry, materials.rock, [x, BED + size * 0.4, z], scene);
      rock.scale.set(size, size * (0.5 + Math.random() * 0.8), size);
      rock.rotation.set(Math.random() * 3, Math.random() * 3, 0);
      rock.castShadow = false;
    }
  }

  function buildOcean() {
    oceanGeo = new THREE.PlaneGeometry(160, 160, 90, 90);
    const waterMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x006699,
      emissive: 0x001122,
      roughness: 0.12,
      metalness: 0.08,
      transparent: true,
      opacity: 0.58,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    oceanMesh = new THREE.Mesh(oceanGeo, waterMaterial);
    oceanMesh.rotation.x = -Math.PI / 2;
    scene.add(oceanMesh);
  }

  function buildFixedStructure() {
    const fixed = new THREE.Group();
    scene.add(fixed);

    makeMesh(new THREE.BoxGeometry(16, 3.2, 16), materials.concrete, [0, BED + 1.6, 0], fixed);
    makeMesh(new THREE.CylinderGeometry(9, 10, 1.2, 32), materials.concrete, [0, BED + 3.8, 0], fixed);

    const top = STATION_Y + 5;
    const shaftHeight = top - BED - 3.8;
    makeMesh(
      new THREE.CylinderGeometry(0.7, 0.7, shaftHeight, 32),
      materials.chrome,
      [0, BED + 3.8 + shaftHeight / 2, 0],
      fixed
    );

    const cable = makeMesh(
      new THREE.CylinderGeometry(0.25, 0.25, 60, 8),
      materials.dark,
      [35, BED + 1.2, 0],
      fixed,
      false
    );
    cable.rotation.z = Math.PI / 2;
  }

  function buildDynamoStation() {
    station = new THREE.Group();
    station.position.set(0, STATION_Y, 0);
    scene.add(station);

    const pinionX = 2.55;
    const stationRadius = pinionX + PINION_RADIUS + 0.6;

    makeMesh(new THREE.CylinderGeometry(stationRadius, stationRadius, 7.5, 40), materials.tube, [0, 0, 0], station);
    [-3.2, 3.2].forEach(y => {
      const rim = makeMesh(new THREE.TorusGeometry(stationRadius + 0.05, 0.18, 12, 40), materials.yellow, [0, y, 0], station);
      rim.rotation.x = Math.PI / 2;
    });
    makeMesh(new THREE.CylinderGeometry(1.5, 1.5, 7.6, 24), materials.sleeve, [0, 0, 0], station);

    pinion = new THREE.Group();
    pinion.position.set(pinionX, 0, 0);
    station.add(pinion);

    const disc = makeMesh(new THREE.CylinderGeometry(PINION_RADIUS * 0.88, PINION_RADIUS * 0.88, 0.8, 32), materials.steel, [0, 0, 0], pinion);
    disc.rotation.x = Math.PI / 2;

    const toothCount = 18;
    const toothGeometry = new THREE.BoxGeometry(0.26, 0.38, 0.8);
    for (let i = 0; i < toothCount; i++) {
      const angle = i / toothCount * Math.PI * 2;
      const tooth = makeMesh(toothGeometry, materials.steel, [Math.cos(angle) * PINION_RADIUS * 0.94, Math.sin(angle) * PINION_RADIUS * 0.94, 0], pinion);
      tooth.rotation.z = angle;
    }

    const gearbox = new THREE.Group();
    gearbox.position.set(pinionX, 0, 0);
    station.add(gearbox);
    const axle = makeMesh(new THREE.CylinderGeometry(0.14, 0.14, 1.4, 12), materials.steel, [0, 0, 0.7], gearbox);
    axle.rotation.x = Math.PI / 2;
    makeMesh(new THREE.BoxGeometry(1.7, 1.7, 0.9), materials.dark, [0, 0, 1.45], gearbox);
    const generatorShell = makeMesh(new THREE.CylinderGeometry(0.95, 0.95, 1.5, 28), materials.shell, [0, 0, 2.65], gearbox);
    generatorShell.rotation.x = Math.PI / 2;
    [-0.6, 0, 0.6].forEach(z => {
      makeMesh(new THREE.TorusGeometry(0.97, 0.06, 8, 28), materials.steel, [0, 0, 2.65 + z], gearbox);
    });

    rotor = new THREE.Group();
    rotor.position.set(0, 0, 2.65);
    gearbox.add(rotor);
    const rotorCore = makeMesh(new THREE.CylinderGeometry(0.42, 0.42, 1.4, 20), materials.chrome, [0, 0, 0], rotor);
    rotorCore.rotation.x = Math.PI / 2;
    for (let i = 0; i < 4; i++) {
      const angle = i / 4 * Math.PI * 2;
      const poleMaterial = material(i % 2 ? 0x3b82f6 : 0xef4444, { metalness: 0.25, roughness: 0.35 });
      const pole = makeMesh(new THREE.BoxGeometry(0.3, 0.4, 1.3), poleMaterial, [Math.cos(angle) * 0.6, Math.sin(angle) * 0.6, 0], rotor);
      pole.rotation.z = angle;
    }
  }

  function buildMovingStructure() {
    while (moving.children.length) moving.remove(moving.children[0]);

    const radius = BUOY_RADIUS;
    const height = BUOY_HEIGHT;
    const pillarOffset = 6;

    const profile = [
      [HOLE_RADIUS, 0],
      [radius - 0.5, 0],
      [radius, 0.5],
      [radius, height - 0.3],
      [radius - 0.3, height],
      [HOLE_RADIUS, height]
    ].map(point => new THREE.Vector2(point[0], point[1]));
    moving.add(new THREE.Mesh(new THREE.LatheGeometry(profile, 64), materials.rubber));

    const trim = makeMesh(new THREE.TorusGeometry(radius + 0.02, 0.35, 12, 64), materials.yellow, [0, height * 0.45, 0], moving);
    trim.rotation.x = Math.PI / 2;

    const topRing = makeMesh(new THREE.RingGeometry(HOLE_RADIUS, radius - 0.3, 64), materials.white, [0, height + 0.02, 0], moving);
    topRing.rotation.x = -Math.PI / 2;

    [[pillarOffset, pillarOffset], [-pillarOffset, pillarOffset], [pillarOffset, -pillarOffset], [-pillarOffset, -pillarOffset]].forEach(([x, z]) => {
      makeMesh(new THREE.CylinderGeometry(0.38, 0.38, HP - height, 16), materials.chrome, [x, (HP + height) / 2, z], moving);
    });

    makeMesh(new THREE.CylinderGeometry(radius - 0.4, radius - 0.4, 1.2, 48), materials.rubber, [0, HP + 0.6, 0], moving);

    const rack = new THREE.Group();
    rack.position.set(1, HP - 34 / 2, 0);
    moving.add(rack);
    const rackBody = makeMesh(new THREE.BoxGeometry(0.3, 34, 0.7), materials.orange, [0, 0, 0], rack);
    rackBody.castShadow = true;

    const rackToothGeometry = new THREE.BoxGeometry(0.3, 0.25, 0.6);
    for (let i = 0; i < 85; i++) {
      makeMesh(rackToothGeometry, materials.orange, [0.25, i / 85 * 34 - 17, 0], rack);
    }

    if (wireframe) setWireframe(moving, true);
  }

  function setWireframe(root, enabled) {
    root.traverse(object => {
      if (!object.isMesh) return;
      const list = Array.isArray(object.material) ? object.material : [object.material];
      list.forEach(mat => { mat.wireframe = enabled; });
    });
  }

  // A smooth visual heave cycle, deliberately independent of physical parameters.
  function heaveAt(time) {
    return 1.05 * Math.sin(time * 0.95) + 0.16 * Math.sin(time * 1.55 + 0.7);
  }

  function waveHeight(x, z, time) {
    const first = 1.05 * Math.cos(0.15 * x - time * 0.95);
    const second = 0.34 * Math.cos(0.23 * (x * 0.8 + z * 0.6) - time * 1.42 + 0.8);
    const third = 0.13 * Math.cos(0.34 * (x * 0.45 - z * 0.9) - time * 1.9 - 0.5);
    return first + second + third;
  }

  function updateOcean(time) {
    const positions = oceanGeo.attributes.position;
    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i);
      const z = -positions.getY(i);
      positions.setZ(i, waveHeight(x, z, time));
    }
    positions.needsUpdate = true;
    oceanGeo.computeVertexNormals();
  }

  function setCamera(name, button) {
    document.querySelectorAll('[data-cam]').forEach(item => item.classList.remove('active'));
    if (button) button.classList.add('active');

    const destination = CAMERAS[name];
    const startPosition = camera.position.clone();
    const startTarget = orbit.target.clone();
    const endPosition = new THREE.Vector3(...destination.position);
    const endTarget = new THREE.Vector3(...destination.target);
    const startTime = performance.now();
    const duration = 850;

    function animateCamera(now) {
      const progress = Math.min((now - startTime) / duration, 1);
      const eased = progress < 0.5
        ? 4 * progress * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;
      camera.position.lerpVectors(startPosition, endPosition, eased);
      orbit.target.lerpVectors(startTarget, endTarget, eased);
      if (progress < 1) requestAnimationFrame(animateCamera);
    }
    requestAnimationFrame(animateCamera);
  }

  function resetAnimation() {
    elapsed = 0;
    generatorAngle = 0;
    lastHeave = heaveAt(0);
    moving.position.y = lastHeave - BASE_DRAFT;
    pinion.rotation.z = -lastHeave / PINION_RADIUS;
    rotor.rotation.z = 0;
  }

  function setupControls() {
    $('btn-pause').addEventListener('click', () => {
      running = !running;
      $('btn-pause').innerHTML = running
        ? '<i class="fa-solid fa-pause"></i> Pause'
        : '<i class="fa-solid fa-play"></i> Resume';
    });

    $('btn-reset').addEventListener('click', resetAnimation);
    $('speed').addEventListener('change', event => {
      animationSpeed = Number(event.target.value) || 1;
    });

    document.querySelectorAll('[data-cam]').forEach(button => {
      button.addEventListener('click', () => setCamera(button.dataset.cam, button));
    });
  }

  function onResize() {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const delta = Math.min(0.05, Math.max(0, (now - previousFrame) / 1000));
    previousFrame = now;

    if (running) {
      const scaledDelta = delta * animationSpeed;
      elapsed += scaledDelta;

      const currentHeave = heaveAt(elapsed);
      const verticalMotion = currentHeave - lastHeave;

      // The buoy, support frame, and rack move together.
      moving.position.y = currentHeave - BASE_DRAFT;

      // The pinion follows the rack; the generator rotor turns in one direction.
      pinion.rotation.z = -currentHeave / PINION_RADIUS;
      generatorAngle += Math.abs(verticalMotion) / PINION_RADIUS * GEAR_RATIO_VISUAL;
      rotor.rotation.z = generatorAngle;

      lastHeave = currentHeave;
    }

    updateOcean(elapsed);
    orbit.update();
    renderer.render(scene, camera);
  }

  function start() {
    initScene();
    setupControls();
    resetAnimation();
    requestAnimationFrame(frame);
  }

  start();
})();
</script>
</body>
</html>
